name: Prebuilt Codex macOS arm64

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - ".github/workflows/prebuilt-codex.yml"
      - "runtime/**"
      - "scripts/prebuilt_ci.py"
      - "tests/**"
  workflow_dispatch:
    inputs:
      version:
        description: Exact upstream Codex version, without the rust-v prefix
        required: true
        type: string
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read

concurrency:
  group: prebuilt-codex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v

      - name: Test the injected Rust route module
        run: python3 scripts/prebuilt_ci.py test-route

  build:
    needs: tests
    if: github.event_name != 'pull_request' && github.repository == 'junfengM/codex-provider-runtime' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      build_required: ${{ steps.plan.outputs.build_required }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select one exact upstream release
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREBUILT_VERSION_INPUT: ${{ github.event.inputs.version }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/prebuilt_ci.py plan

      - name: Read exact-tag Rust and Cargo cache identity
        id: cache_identity
        if: steps.plan.outputs.build_required == 'true'
        env:
          PREBUILT_VERSION: ${{ steps.plan.outputs.version }}
        run: python3 scripts/prebuilt_ci.py cache-metadata

      - name: Install exact upstream Rust toolchain
        if: steps.plan.outputs.build_required == 'true'
        env:
          PREBUILT_TOOLCHAIN: ${{ steps.cache_identity.outputs.toolchain }}
        run: rustup toolchain install "$PREBUILT_TOOLCHAIN" --profile minimal --no-self-update

      - name: Restore bounded Cargo cache
        id: cargo_cache
        if: steps.plan.outputs.build_required == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/prebuilt-runtime/cache/cargo-target
          key: ${{ runner.os }}-macos15-arm64-rust-${{ steps.cache_identity.outputs.toolchain }}-${{ steps.cache_identity.outputs.target }}-lock-${{ steps.cache_identity.outputs.lock_sha256 }}-recipe-${{ steps.cache_identity.outputs.recipe_sha256 }}
          restore-keys: |
            ${{ runner.os }}-macos15-arm64-rust-${{ steps.cache_identity.outputs.toolchain }}-${{ steps.cache_identity.outputs.target }}-lock-${{ steps.cache_identity.outputs.lock_sha256 }}-
            ${{ runner.os }}-macos15-arm64-rust-${{ steps.cache_identity.outputs.toolchain }}-${{ steps.cache_identity.outputs.target }}-

      - name: Check restored cache size
        id: restored_cache_size
        if: steps.plan.outputs.build_required == 'true'
        run: >-
          python3 scripts/prebuilt_ci.py guard-cache
          --path "$HOME/.cargo/registry"
          --path "$HOME/.cargo/git"
          --path "$RUNNER_TEMP/prebuilt-runtime/cache/cargo-target"

      - name: Drop an oversized restored Rust target cache
        if: steps.plan.outputs.build_required == 'true' && steps.restored_cache_size.outputs.within_limit != 'true'
        run: rm -rf "$RUNNER_TEMP/prebuilt-runtime/cache/cargo-target"

      - name: Build and package the patched Codex CLI
        if: steps.plan.outputs.build_required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREBUILT_VERSION: ${{ steps.plan.outputs.version }}
          PREBUILT_TOOLCHAIN: ${{ steps.cache_identity.outputs.toolchain }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          python3 scripts/prebuilt_ci.py build
          --install-root "$RUNNER_TEMP/prebuilt-runtime"
          --output-dir "$RUNNER_TEMP/prebuilt-artifact"

      - name: Measure cache before saving
        id: final_cache_size
        if: steps.plan.outputs.build_required == 'true'
        run: >-
          python3 scripts/prebuilt_ci.py guard-cache
          --path "$HOME/.cargo/registry"
          --path "$HOME/.cargo/git"
          --path "$RUNNER_TEMP/prebuilt-runtime/cache/cargo-target"

      - name: Save bounded Cargo cache
        if: steps.plan.outputs.build_required == 'true' && steps.cargo_cache.outputs.cache-hit != 'true' && steps.final_cache_size.outputs.within_limit == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/prebuilt-runtime/cache/cargo-target
          key: ${{ runner.os }}-macos15-arm64-rust-${{ steps.cache_identity.outputs.toolchain }}-${{ steps.cache_identity.outputs.target }}-lock-${{ steps.cache_identity.outputs.lock_sha256 }}-recipe-${{ steps.cache_identity.outputs.recipe_sha256 }}

      - name: Upload release candidate for main-only attestation
        if: steps.plan.outputs.build_required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prebuilt-codex-${{ steps.plan.outputs.version }}
          path: |
            ${{ runner.temp }}/prebuilt-artifact/codex-provider-macos-arm64.tar.gz
            ${{ runner.temp }}/prebuilt-artifact/release-candidate.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [tests, build]
    if: needs.build.outputs.build_required == 'true' && github.repository == 'junfengM/codex-provider-runtime' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: prebuilt-codex-${{ needs.build.outputs.version }}
          path: ${{ runner.temp }}/prebuilt-artifact

      - name: Check whether the exact release is already complete
        id: publish_plan
        env:
          GH_TOKEN: ${{ github.token }}
          PREBUILT_RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: python3 scripts/prebuilt_ci.py publish-plan

      - name: Attest the release archive
        id: attest
        if: steps.publish_plan.outputs.already_complete != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/prebuilt-artifact/codex-provider-macos-arm64.tar.gz

      - name: Place the public attestation bundle
        if: steps.publish_plan.outputs.already_complete != 'true'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "$RUNNER_TEMP/prebuilt-artifact/codex-provider-macos-arm64.intoto.jsonl"

      - name: Verify and publish the attested release assets
        if: steps.publish_plan.outputs.already_complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/prebuilt_ci.py publish --artifact-dir "$RUNNER_TEMP/prebuilt-artifact"
